# CodeRabbit Configuration for EcoTrack
# Documentation: https://docs.coderabbit.ai/guides/review-instructions/

version: "2"
language: "en-US"
early_access: true

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "draft"
  path_filters:
    - "!node_modules/**"
    - "!package-lock.json"
    - "!.git/**"
    - "!tools/git-worktree-runner/tests/**"
  path_instructions:
    - path: "**/*.html"
      instructions: |
        - Ensure semantic HTML5 tags (<header>, <nav>, <main>, <section>, <article>, <footer>) are properly structured.
        - Verify WCAG 2.1 AA accessibility: all interactive elements must have accessible labels, aria-expanded/aria-controls where applicable, and keyboard focus outlines.
        - Ensure responsive meta tags, valid image alt text, and lazy loading on below-the-fold media.
        - Verify form controls have associated <label> elements, input validation attributes, and ARIA alert containers for feedback.
    - path: "**/*.css"
      instructions: |
        - Check CSS custom properties (variables) organization and responsive design consistency.
        - Ensure support for prefers-reduced-motion to respect user vestibular accessibility settings.
        - Guard against overflow issues, horizontal scrolling bugs on mobile devices, and unstyled layout shifts (CLS).
        - Verify color contrast ratios meet WCAG AA minimum 4.5:1 for normal text and 3:1 for large text.
    - path: "**/*.js"
      instructions: |
        - Enforce modern ECMAScript standards (ES6+), strict mode compliance, and avoidance of global namespace pollution.
        - Prevent XSS vulnerabilities: avoid unsafe innerHTML injection; sanitize dynamic values or use textContent/createElement.
        - Verify IntersectionObserver disconnect/unobserve cleanups and performance optimization.
        - Ensure resilient error handling and graceful fallbacks when DOM elements or APIs (e.g. Geolocation, LocalStorage) are unavailable.

chat:
  auto_reply: true

issue_enrichment:
  planning:
    enabled: true
